name: Build

on:
  workflow_dispatch:
    # Inputs the workflow accepts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v2
      with:
        submodules: recursive

    - name: Checkout zipper
      uses: actions/checkout@v2
      with:
        repository: tillua467/AK34Phnx
        ref: main
        path: zipper

    - name: Android kernel build
      uses: tillua467/android-kernel-actions@master
      id: build
      env:
        NAME: UnHoly Kernel
      with:
        arch: arm64
        compiler: gcc
        defconfig: phoenix_defconfig
        image: Image

    - name: Release build
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.CHANNEL_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: Kernel is built!, took ${{ steps.build.outputs.elapsed_time }} seconds.
        document: ${{ steps.build.outputs.outfile }}
